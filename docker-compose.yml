services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-ayurevidence-demo}
      DEMO_NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ayurevidence-demo}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4j_data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$$DEMO_NEO4J_PASSWORD\" \"RETURN 1\" >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-ayurevidence-demo}
      PUBMED_API_KEY: ${PUBMED_API_KEY:-}
      NCBI_EMAIL: ${NCBI_EMAIL:-researcher@example.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["8000:8000"]
    volumes: ["./storage:/app/storage"]
    depends_on:
      neo4j: {condition: service_healthy}
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  neo4j_data:
